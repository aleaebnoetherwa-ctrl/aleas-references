<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit reference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="submit-page edit-page">

  <div class="header">
    <img src="images/logo.png" class="logo">
    <h1>Edit reference</h1>
  </div>

  <nav class="page-actions" aria-label="Page actions">
    <a class="button-link" href="index.html">Back to filtering</a>
  </nav>

  <section class="submit-reference">
    <form id="submitForm">
      <label for="submitImage">Image URL</label>
      <input id="submitImage" name="image" type="url" required placeholder="https://example.com/image.jpg">

      <label for="submitSource">Source URL</label>
      <input id="submitSource" name="source" type="url" placeholder="https://example.com/project-page/">

      <label>Title</label>
      <div class="title-row submit-title-row">
        <input id="submitTitleAuthor" name="title_author" required placeholder="Author">
        <span class="title-separator">—</span>
        <input id="submitTitleProject" name="title_project" required placeholder="Project Name">
      </div>

      <fieldset class="submit-tags">
        <legend>Existing tags</legend>
        <div class="tag-search submit-tag-search">
          <label for="submitTagSearch">Search tags</label>
          <input id="submitTagSearch" type="search" autocomplete="off" placeholder="type a tag">
          <div id="submitTagSuggestions" class="tag-suggestions"></div>
        </div>
        <div id="submitTagGroups"></div>
      </fieldset>

      <fieldset class="submit-tags">
        <legend>New tags</legend>
        <p class="submit-help">For new Author tags, enter surname first, then given name. Example: Zumthor Peter.</p>
        <div id="newSubmitTagRows"></div>
        <button id="addSubmitTagRow" type="button">Add new tag</button>
      </fieldset>

      <button type="submit">Save changes</button>
      <p id="submitStatus" aria-live="polite"></p>
    </form>
  </section>

  <script src="supabase-config.js"></script>
  <script src="script.js"></script>

</body>
</html>
